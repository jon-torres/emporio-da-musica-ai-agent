[project]
name = "emporio-da-musica-agent"
version = "0.1.0"
description = "AI Customer Service Agent for Empório da Música"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AI Engineer Candidate" }
]
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "streamlit>=1.35.0",
    "pypdf>=4.2.0",
    "rank-bm25>=0.2.2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
emporio-agent = "emporio_agent.cli:main"
emporio-ui = "emporio_agent.ui:run_ui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
